name: Verify Orienta
on:
  pull_request:
  push:
    branches: ['codex/orienta-launch-readiness']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orienta-verification
          path: |
            output/
            dist/
            package-lock.json
